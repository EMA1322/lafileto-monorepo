name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# SEC-04: Secret Scanning and Push Protection are enabled manually in repository settings.
# Husky runs the local staged scan; Dependabot maintains pinned GitHub Actions.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          # Official v8.30.1 Linux x64 release and SHA-256 from its GitHub release.
          # Verify before execution to avoid running an unverified downloaded binary.
          readonly VERSION="8.30.1"
          readonly ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          readonly URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          readonly SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          readonly INSTALL_DIR="${RUNNER_TEMP}/gitleaks-${VERSION}"

          mkdir -p "${INSTALL_DIR}"
          curl --fail --location --silent --show-error "${URL}" --output "${RUNNER_TEMP}/${ARCHIVE}"
          echo "${SHA256}  ${RUNNER_TEMP}/${ARCHIVE}" | sha256sum --check --status
          tar --extract --gzip --file "${RUNNER_TEMP}/${ARCHIVE}" --directory "${INSTALL_DIR}"
          install --mode 0755 "${INSTALL_DIR}/gitleaks" "${RUNNER_TEMP}/gitleaks"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan event commits
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          is_sha() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]]
          }

          require_commit() {
            is_sha "$1" || { echo "Invalid Git SHA for $2." >&2; exit 1; }
            git cat-file -e "$1^{commit}" || { echo "Missing Git commit object for $2." >&2; exit 1; }
          }

          scan_range() {
            local base="$1"
            local head="$2"
            local merge_base
            local count

            require_commit "${base}" "base"
            require_commit "${head}" "head"
            merge_base="$(git merge-base "${base}" "${head}")" || { echo "Could not calculate merge-base." >&2; exit 1; }
            count="$(git rev-list --count "${merge_base}..${head}")"
            [[ "${count}" -gt 0 ]] || { echo "Refusing an empty Git range." >&2; exit 1; }
            echo "Scanning ${count} commit(s) from ${merge_base}..${head}."
            gitleaks git --config .gitleaks.toml --redact=100 --log-opts="${merge_base}..${head}"
          }

          scan_push_range() {
            local before="$1"
            local head="$2"
            local count

            require_commit "${before}" "push before"
            require_commit "${head}" "push head"
            git merge-base --is-ancestor "${before}" "${head}" || {
              echo "Push before is not an ancestor of push head; refusing an ambiguous range." >&2
              exit 1
            }
            count="$(git rev-list --count "${before}..${head}")"
            [[ "${count}" -gt 0 ]] || { echo "Refusing an empty Git range." >&2; exit 1; }
            echo "Scanning ${count} commit(s) from ${before}..${head}."
            gitleaks git --config .gitleaks.toml --redact=100 --log-opts="${before}..${head}"
          }

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            scan_range "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            require_commit "${PUSH_HEAD_SHA}" "push head"
            if [[ "${PUSH_BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              parent="$(git rev-parse "${PUSH_HEAD_SHA}^")" || {
                echo "Initial push fallback scans the root commit." >&2
                gitleaks git --config .gitleaks.toml --redact=100 --log-opts="-1 ${PUSH_HEAD_SHA}"
                exit 0
              }
              scan_push_range "${parent}" "${PUSH_HEAD_SHA}"
            else
              scan_push_range "${PUSH_BEFORE_SHA}" "${PUSH_HEAD_SHA}"
            fi
          else
            echo "Unsupported event: ${EVENT_NAME}" >&2
            exit 1
          fi
