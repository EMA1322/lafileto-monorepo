name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Instala pnpm y lo agrega al PATH del runner
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Verify pnpm
        run: |
          which pnpm
          pnpm -v

      # Cache del store de pnpm para acelerar installs
      - name: Resolve pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install deps (runs prisma generate via postinstall)
        run: pnpm install --frozen-lockfile

      - name: Run lint (all workspaces)
        run: pnpm -r lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8
        env:
          # These values are exclusively for the ephemeral MySQL service created by CI.
          MYSQL_ROOT_PASSWORD: ci_ephemeral_root_password
          MYSQL_USER: ci_ephemeral_service_user
          MYSQL_PASSWORD: ci_ephemeral_service_password
          MYSQL_DATABASE: lafileto_ci_ephemeral
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_ephemeral_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # This connection targets only the ephemeral MySQL service declared above.
      DATABASE_URL: mysql://ci_ephemeral_service_user:ci_ephemeral_service_password@127.0.0.1:3306/lafileto_ci_ephemeral
      # These credentials seed only the ephemeral administrator used by CI tests.
      ADMIN_EMAIL: ci-admin@example.invalid
      ADMIN_PASSWORD: ci_ephemeral_admin_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Verify pnpm
        run: |
          which pnpm
          pnpm -v

      - name: Resolve pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install deps (runs prisma generate via postinstall)
        run: pnpm install --frozen-lockfile

      - name: Prepare backend database
        run: |
          pnpm --filter backend prisma generate
          pnpm --filter backend prisma migrate deploy
          pnpm --filter backend run seed

      - name: Run tests (all workspaces)
        run: pnpm -r test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Verify pnpm
        run: |
          which pnpm
          pnpm -v

      - name: Resolve pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install deps (runs prisma generate via postinstall)
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm -F backend build

      - name: Build client
        run: pnpm -F client build

      - name: Build admin
        run: pnpm -F admin build
